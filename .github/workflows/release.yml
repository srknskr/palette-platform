name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Backend BootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Build Web Application
        working-directory: web
        run: |
          npm ci
          npm run build
          tar -czf ../web-dist.tar.gz -C dist .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Name
        id: tag_info
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/palette-platform-backend:latest
            ghcr.io/${{ github.repository_owner }}/palette-platform-backend:${{ steps.tag_info.outputs.tag }}

      - name: Build and Push Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/palette-platform-web:latest
            ghcr.io/${{ github.repository_owner }}/palette-platform-web:${{ steps.tag_info.outputs.tag }}

      - name: Generate Checksums and Prepare Assets
        run: |
          mkdir -p release-assets
          cp backend/build/libs/*.jar release-assets/palette-backend-${{ steps.tag_info.outputs.tag }}.jar
          cp web-dist.tar.gz release-assets/palette-web-${{ steps.tag_info.outputs.tag }}.tar.gz
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Palette Platform ${{ steps.tag_info.outputs.tag }}
          files: |
            release-assets/*
          generate_release_notes: true
