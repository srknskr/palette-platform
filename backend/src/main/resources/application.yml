spring:
  application:
    name: palette-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/palette}
    username: ${DB_USERNAME:palette}
    password: ${DB_PASSWORD:palette}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
