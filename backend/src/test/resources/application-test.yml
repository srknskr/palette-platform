spring:
  datasource:
    url: jdbc:h2:mem:palette;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: testSecretKeyMustBeAtLeast32BytesLongForHS256Security123456
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7
