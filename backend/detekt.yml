build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  TooManyFunctions:
    active: false
  LongParameterList:
    active: false
  LargeClass:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^([a-zA-Z][a-zA-Z0-9]*|`.*`)$'

style:
  active: true
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    active: false
